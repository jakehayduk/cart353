    <canvas id="particleCanvas"></canvas>
    <script>
        (function() {

            const canvas = document.getElementById('particleCanvas');

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const ctx = canvas.getContext('2d');

            const gravity = 0;

            const rand = (min, max) => Math.random() * (max - min) + min;

            let particles = [];

            let mouseX;
            let mouseY;
            let mouseX2;
            let mouseY2;
            let mouseVX;
            let mouseVY;
            
            canvas.addEventListener('mousemove', (e) => {
                
                mouseX2 = mouseX;
                mouseY2 = mouseY;

                mouseX = e.offsetX;
                mouseY = e.offsetY;

                mouseVX = mouseX - mouseX2;
                mouseVY = mouseY - mouseY2;
            })

            const triangle1 = [
                {x:100, y:50},
                {x:200, y:20},
                {x:250, y:130}
            ]

            const triangle2 = [
                {x:500, y:50},
                {x:300, y:20},
                {x:290, y:130}
            ]

            const triangle2Ori = [
                {x:500, y:50},
                {x:300, y:20},
                {x:290, y:130}
            ]

            function getAxes(vertices) {
                let axes = [];
                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];

                    // subtract vertices to get each edge (with x and y vectors)
                    let edge = {x: p2.x - p1.x, y: p2.y - p1.y};

                    let normal = {x: -edge.y, y: edge.x};
                    let length = Math.sqrt(normal.x * normal.x + normal.y * normal.y);

                    axes.push({
                        x: normal.x / length,
                        y: normal.y / length
                    })
                }

                return axes;
            }

            function project(vertices, axis) {
                let min = (vertices[0].x * axis.x) + (vertices[0].y * axis.y);
                let max = min;

                for (let i = 1; i < vertices.length; i++) {
                    // dot product projection
                    let projection = (vertices[i].x * axis.x) + (vertices[i].y * axis.y);

                    if (projection < min) {min = projection;}
                    if (projection > max) {max = projection;}
                }
                // return the projected 1D shadow shape
                return {min: min, max: max}; 
            }

            function checkCollision(shapeA, shapeB) {
                let axes = [...getAxes(shapeA), ...getAxes(shapeB)]

                for (let axis of axes) {
                    let shadowA = project(shapeA, axis);
                    let shadowB = project(shapeB, axis);

                    if (shadowA.max < shadowB.min || shadowB.max < shadowA.min) {
                        return false; // no collision
                    }
                }

                return true; // collision
            }

            function drawPolygon(vertices, color) {
                ctx.beginPath();
                ctx.moveTo(vertices[0].x, vertices[0].y);
                for (let i = 1; i < vertices.length; i++) {
                    ctx.lineTo(vertices[i].x, vertices[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            };

            function draw() {
                for (let i = 0; i < triangle2.length; i++) {
                    triangle2[i].x = triangle2Ori[i].x + mouseX - canvas.width;
                    triangle2[i].y = triangle2Ori[i].y + mouseY;
                }

                ctx.clearRect(0,0,canvas.width, canvas.height);

                let isColliding = checkCollision(triangle1, triangle2);

                let color = isColliding ? 'rgba(255, 0, 0, 0.7)' : 'rgba(0, 255, 0, 0.7)';

                drawPolygon(triangle1, color);
                drawPolygon(triangle2, color);
