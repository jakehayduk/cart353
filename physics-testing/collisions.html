<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collisions</title>

    <style>
        canvas {
            display: block;
            border-radius: 20px;
            background: #0f1219;
            width: min(96vw, 96vh);
            height: min(96vw, 96vh);
            max-width: 800px;
            max-height: 800px;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <script>
        (function() {

            const canvas = document.getElementById('particleCanvas');

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const ctx = canvas.getContext('2d');

            const gravity = 0;

            const rand = (min, max) => Math.random() * (max - min) + min;

            let particles = [];

            let mouseX;
            let mouseY;
            let mouseX2;
            let mouseY2;
            let mouseVX;
            let mouseVY;
            
            canvas.addEventListener('mousemove', (e) => {
                
                mouseX2 = mouseX;
                mouseY2 = mouseY;

                mouseX = e.offsetX;
                mouseY = e.offsetY;

                mouseVX = mouseX - mouseX2;
                mouseVY = mouseY - mouseY2;
            })

            const triangle1 = [
                {x:100, y:50},
                {x:200, y:20},
                {x:250, y:130}
            ]

            const triangle2 = [
                {x:100, y:50},
                {x:200, y:20},
                {x:250, y:130}
            ]

            function getAxes(vertices) {
                let axes = [];
                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];

                    // subtract vertices to get each edge (with x and y vectors)
                    let edge = {x: p2.x - p1.x, y: p2.y - p1.y};

                    let normal = {x: -edge.y, y: edge.x};
                    let length = Math.sqrt(normal.x * normal.x + normal.y * normal.y);

                    axes.push({
                        x: normal.x / length,
                        y: normal.y / length
                    })
                }

                return axes;
            }

            function project(vertices, axis) {
                let min = (vertices[0].x * axis.x) + (vertices[0].y * axis.y);
                let max = min;

                for (let i = 1; i < vertices.length; i++) {
                    // dot product projection
                    let projection = (vertices[i].x * axis.x) + (vertices[i].y * axis.y);

                    if (projection < min) {min = projection;}
                    if (projection > max) {max = projection;}
                }
                // return the projected 1D shadow shape
                return {min: min, max: max}; 
            }

            function draw() {

                ctx.clearRect(0,0,canvas.width, canvas.height);

                ctx.beginPath();
                ctx.moveTo(triangle1[0].x, triangle1[0].y);

                for (let i = 1; i < triangle1.length; i++) {
                    ctx.lineTo(triangle1[i].x, triangle1[i].y);
                }

                ctx.closePath();

                ctx.fillStyle = "#4CAF50";
                ctx.fill();

                
                let tempAxes = getAxes(triangle1);
                let projected = project(triangle1, tempAxes[0])

                // console.log(projected);
                
                ctx.beginPath();
                ctx.moveTo(projected.min * tempAxes[0].x, projected.min * tempAxes[0].y);
                ctx.lineTo(projected.max * tempAxes[0].x, projected.max * tempAxes[0].y);
                ctx.strokeStyle = "red";
                ctx.lineWidth = 3;
                ctx.stroke();
                console.log("x: " + projected.min * tempAxes[0].x + "\n"+ "y: " + projected.min * tempAxes[0].y);
                
                

                // ctx.beginPath();
                // ctx.moveTo(points[0].x + mouseX, points[0].y + mouseY);

                // for (let i = 1; i < points.length; i++) {
                //     ctx.lineTo(points[i].x + mouseX, points[i].y + mouseY);
                // }

                // ctx.closePath();

                // ctx.fillStyle = "#4CAF50";
                // ctx.fill();
            }

            function loop() {
                                
                draw();

                requestAnimationFrame(loop);
            }

            loop();
        })()
    </script>
</body>
</html>
