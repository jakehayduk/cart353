            let polygons = [];

            function createPoly(vertNum, size) {
                const points = [];

                // points.push({

                // })

                let spawnX;

                // }

                points.vertNum = vertNum;

                // points.centerX = spawnX;
                // points.centerY = spawnY;

            polygons.push(createPoly(3, 50));

            // SAT

            function getAxes(vertices) {
                let axes = [];
                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];

                    // subtract vertices to get each edge (with x and y vectors)
                    let edge = {x: p2.x - p1.x, y: p2.y - p1.y};

                    let normal = {x: -edge.y, y: edge.x};
                    let length = Math.sqrt(normal.x * normal.x + normal.y * normal.y);

                    axes.push({
                        x: normal.x / length,
                        y: normal.y / length
                    })
                }

                return axes;
            }

            function project(vertices, axis) {
                let min = (vertices[0].x * axis.x) + (vertices[0].y * axis.y);
                let max = min;

                for (let i = 1; i < vertices.length; i++) {
                    // dot product projection
                    let projection = (vertices[i].x * axis.x) + (vertices[i].y * axis.y);

                    if (projection < min) {min = projection;}
                    if (projection > max) {max = projection;}
                }
                // return the projected 1D shadow shape
                return {min: min, max: max}; 
            }

            function checkCollision(shapeA, shapeB) {
                let axes = [...getAxes(shapeA), ...getAxes(shapeB)];
                let minOverlap = Infinity;
                let smallestAxis = null;
                
                for (let axis of axes) {
                    let shadowA = project(shapeA, axis);
                    let shadowB = project(shapeB, axis);

                    if (shadowA.max < shadowB.min || shadowB.max < shadowA.min) {
                        return {colliding: false}; // no collision
                    }

                    let overlap = Math.min(shadowA.max, shadowB.max) - Math.max(shadowA.min, shadowB.min);
                    if (overlap < minOverlap) {
                        minOverlap = overlap;
                        smallestAxis = axis;
                    }
                }

                let centerA = getCenter(shapeA);
                let centerB = getCenter(shapeB);
                let dirX = centerB.x - centerA.x;
                let dirY = centerB.y - centerA.y;

                if ((dirX * smallestAxis.x + dirY * smallestAxis.y) < 0) {
                    smallestAxis = {x: -smallestAxis.x, y: -smallestAxis.y};
                }

                return {
                    colliding: true,
                    normal: smallestAxis,
                    depth: minOverlap
                }; // collision
            }

            function createPolygon() {
                // do something
            }

            function drawPolygon(vertices, color) {
                ctx.beginPath();
                ctx.moveTo(vertices[0].x, vertices[0].y);
                for (let i = 1; i < vertices.length; i++) {
                    ctx.lineTo(vertices[i].x, vertices[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            };

            function getCenter(vertices) {
                // find the shape's center
                let centerX = 0;
                let centerY = 0;

                for (let i = 0; i < vertices.length; i++) {
                    centerX += vertices[i].x;
                    centerY += vertices[i].y;
                }
                
                centerX = centerX / vertices.length;
                centerY = centerY / vertices.length;

                return {x: centerX, y: centerY};
            }

            function rotatePolygon(vertices, angle) {
                let centerX = getCenter(vertices).x;
                let centerY = getCenter(vertices).y;

                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                for (let i = 0; i < vertices.length; i++) {
                    let point = vertices[i];

                    let dx = point.x - centerX;
                    let dy = point.y - centerY;

                    let rotatedX = dx * cos - dy * sin;
                    let rotatedY = dx * sin + dy * cos;

                    point.x = centerX + rotatedX;
                    point.y = centerY + rotatedY;
                }

                player.rot += angle;
            }

            let friction = 0.97;
            let maxSpeed = 3;
            let maxRotSpeed = maxSpeed / 70;

            function draw() {
                // for (let i = 0; i < triangle2.length; i++) {
                //     triangle2[i].x = triangle2Ori[i].x + mouseX - canvas.width;
                //     triangle2[i].y = triangle2Ori[i].y + mouseY;
                // }

                if (up) {
                    player.vy += Math.sin(player.rot) * 0.1;
                    player.vx += Math.cos(player.rot) * 0.1;

                    // player.vy = Math.max(player.vy, -maxSpeed); 
                    // player.xy = Math.max(player.xy, -maxSpeed); 
                } else if (down) {
                    // player.vy += Math.sin(player.rot) * -0.1;
                    // player.vx += Math.cos(player.rot) * -0.1;

                    // player.vy = Math.max(player.vy, -maxSpeed); 
                    // player.xy = Math.max(player.xy, -maxSpeed);
                    player.vy += Math.sin(player.rot) * -0.1;
                    player.vx += Math.cos(player.rot) * -0.1;
                }
                
                
                player.vy *= friction;
                player.vx *= friction;

                if (left) {
                    player.av -= 0.005;
                    
                } else if (right) {
                    player.av += 0.005;
                } 

                player.av *= friction;

                player.av = Math.min(Math.max(player.av, -maxRotSpeed), maxRotSpeed);
                rotatePolygon(player, player.av);

                // player.centerY = player.centerY + player.vy;

                for (let i = 0; i < player.length; i++) {
                    player[i].y = player[i].y + player.vy;
                    player[i].x = player[i].x + player.vx;
                }

                ctx.clearRect(0,0,canvas.width, canvas.height);

                let collision = checkCollision(polygons[0], polygons[1]);

                let color = collision.colliding ? 'rgba(255, 0, 0, 0.5)' : 'rgba(0, 255, 0, 0.7)';

                if (collision.colliding) {
                    for (let i = 0; i < player.length; i++) {
                        player[i].x -= collision.normal.x * collision.depth;
                        player[i].y -= collision.normal.y * collision.depth;
                    }
                    
                    let dot = player.vx * collision.normal.x + player.vy * collision.normal.y;
                    if (dot > 0) {
                        console.log("test");
                        let restitution = 1;
                        player.vx -= (1 + restitution) * dot * collision.normal.x;
                        player.vy -= (1 + restitution) * dot * collision.normal.y;
                    }
                }

                

                // if (isColliding) {
                //     player.vy *= -1;
                //     player.vx *= -1;
                // }
                // let color = 'rgba(255, 255, 255, 1)';

                drawPolygon(polygons[0], color);
                drawPolygon(polygons[1], color);

                // for (let i = 1; i < triangle2.length; i++) {
                //     triangle2[i].x = triangle2[i].x + mouseX;
                //     triangle2[i].y = triangle2[i].y + mouseY;
                // }
                // console.log(triangle2[0].x + mouseX);
                

                // let tempAxes = getAxes(polygons[0]);
                

                // console.log(projected);
                
                // for (let i = 0; i < tempAxes.length; i++) {
                //     let projected = project(triangle1, tempAxes[i]);
                //     ctx.beginPath();
                //     ctx.moveTo(projected.min * tempAxes[i].x, projected.min * tempAxes[i].y);
                //     ctx.lineTo(projected.max * tempAxes[i].x, projected.max * tempAxes[i].y);
                //     ctx.strokeStyle = "rgba(255, 0, 0, 0.3)";
                //     ctx.lineWidth = 3;
                //     ctx.stroke();
                //     ctx.closePath();
                //     console.log(projected);
                // }
                
                
                

                // ctx.beginPath();
                // ctx.moveTo(points[0].x + mouseX, points[0].y + mouseY);

                // for (let i = 1; i < points.length; i++) {
                //     ctx.lineTo(points[i].x + mouseX, points[i].y + mouseY);
                // }

                // ctx.closePath();

                // ctx.fillStyle = "#4CAF50";
                // ctx.fill();
            }

            let frameCount = 0;
            let fps = 60;
            let lastTime = performance.now();

            function loop(currentTime) {
                                
                draw();

                frameCount++;
                if (currentTime - lastTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastTime = currentTime;
                }

                ctx.fillStyle = "white";
                ctx.font = "16px monospace";
                ctx.fillText(fps, 10, 25); 
                
                requestAnimationFrame(loop);
            }

            loop();
        })()
