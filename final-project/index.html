<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collisions</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            background-color: black;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <script>
        (function() {

            const canvas = document.getElementById('particleCanvas');

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const ctx = canvas.getContext('2d');

            // update canvas size on viewport resize
            function handleResize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                canvas.width = width;
                canvas.height = height;
            }

            window.addEventListener('resize', handleResize);

            const gravity = 0;

            const rand = (min, max) => Math.random() * (max - min) + min;
            const lerp = (a, b, t) => a * (1 - t) + b * t;

            let particles = [];

            // let mouseX;
            // let mouseY;
            // let mouseX2;
            // let mouseY2;
            // let mouseVX;
            // let mouseVY;
            
            // canvas.addEventListener('mousemove', (e) => {
                
            //     mouseX2 = mouseX;
            //     mouseY2 = mouseY;

            //     mouseX = e.offsetX;
            //     mouseY = e.offsetY;

            //     mouseVX = mouseX - mouseX2;
            //     mouseVY = mouseY - mouseY2;
            // })

            let up = false;
            let down = false;
            let left = false;
            let right = false;
            
            window.addEventListener('keydown', (e) => {
                
                switch (e.key) {
                    case "ArrowUp" :
                    case "w":
                        up = true;
                        break;
                    case "ArrowDown":
                    case "s":
                        down = true;
                        break;
                    case "ArrowLeft" :
                    case "a":
                        left = true;
                        break;
                    case "ArrowRight":
                    case "d":
                        right = true;
                        break;
                }
            })

            window.addEventListener('keyup', (e) => {
                
                switch (e.key) {
                    case "ArrowUp" :
                    case "w":
                        up = false;
                        break;
                    case "ArrowDown":
                    case "s":
                        down = false;
                        break;
                    case "ArrowLeft" :
                    case "a":
                        left = false;
                        break;
                    case "ArrowRight":
                    case "d":
                        right = false;
                        break;
                }
            })

            const triangle2 = [
                {x:500, y:50},
                {x:300, y:20},
                {x:290, y:130}
            ]

            let polygons = [];

            function createPoly(isPlayer, vertNum, size, duplicate, pos, hue, vel) {
                const points = [];

                let spawnX;
                let spawnY;

                if (isPlayer) {
                    spawnX = canvas.width / 2;
                    spawnY = canvas.height / 2;
                } else if (pos) {
                    spawnX = pos.x;
                    spawnY = pos.y;
                } else {
                    spawnX = rand(0, canvas.width);
                    spawnY = rand(0, canvas.height);
                }

                for (let i = 0; i < vertNum; i++) {
                    const angle = (i * 2 * Math.PI / vertNum) - (Math.PI / 2);

                    const x = spawnX + size * Math.cos(angle);
                    const y = spawnY + size * Math.sin(angle);

                    points.push({
                        x: Number(x.toFixed(2)),
                        y: Number(y.toFixed(2))
                    })
                }

                if (isPlayer) {
                    points.vertNum = vertNum;
                    points.size = size;
                    points.vx = 0;
                    points.vy = 0;
                    points.rot = Math.PI * 1.5; // rotation in radians
                    points.av = 0; // angular velocity
                    points.health = 100;
                    points.hue = rand(0, 360);
                } else {
                    points.vertNum = vertNum;
                    points.size = size;
                    points.vx = vel ? vel.x : 0;
                    points.vy = vel ? vel.y : 0;
                    points.rot = Math.PI * (rand(0, 20) / 10); // rotation in radians
                    points.av = 0; // angular velocity
                    points.speed = rand(1, 20) / 100;
                    points.health = 100;
                    points.hue = hue ? hue : rand(0, 360);
                    points.dup = duplicate;
                    points.attacked = 0;
                }
                

                return points;
            }

            polygons.push(createPoly(true, 3, 50)); // pass true to indicate it is the player shape.
            // create the player shape and use this shorthand for accessing the player node easily
            let player = polygons[0];

            polygons.push(createPoly(false, 5, 100));
            polygons.push(createPoly(false, 4, 50));
            polygons.push(createPoly(false, 7, 30));

            // SAT

            function getAxes(vertices) {
                let axes = [];
                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];

                    // subtract vertices to get each edge (with x and y vectors)
                    let edge = {x: p2.x - p1.x, y: p2.y - p1.y};

                    let normal = {x: -edge.y, y: edge.x};
                    let length = Math.sqrt(normal.x * normal.x + normal.y * normal.y);

                    axes.push({
                        x: normal.x / length,
                        y: normal.y / length
                    })
                }

                return axes;
            }

            function project(vertices, axis) {
                let min = (vertices[0].x * axis.x) + (vertices[0].y * axis.y);
                let max = min;

                for (let i = 1; i < vertices.length; i++) {
                    // dot product projection
                    let projection = (vertices[i].x * axis.x) + (vertices[i].y * axis.y);

                    if (projection < min) {min = projection;}
                    if (projection > max) {max = projection;}
                }
                // return the projected 1D shadow shape
                return {min: min, max: max}; 
            }

            function checkCollision(shapeA, shapeB) {
                let axes = [...getAxes(shapeA), ...getAxes(shapeB)];
                let minOverlap = Infinity;
                let smallestAxis = null;
                
                for (let axis of axes) {
                    let shadowA = project(shapeA, axis);
                    let shadowB = project(shapeB, axis);

                    if (shadowA.max < shadowB.min || shadowB.max < shadowA.min) {
                        return {colliding: false}; // no collision
                    }

                    let overlap = Math.min(shadowA.max, shadowB.max) - Math.max(shadowA.min, shadowB.min);
                    if (overlap < minOverlap) {
                        minOverlap = overlap;
                        smallestAxis = axis;
                    }
                }

                let centerA = getCenter(shapeA);
                let centerB = getCenter(shapeB);
                let dirX = centerB.x - centerA.x;
                let dirY = centerB.y - centerA.y;

                if ((dirX * smallestAxis.x + dirY * smallestAxis.y) < 0) {
                    smallestAxis = {x: -smallestAxis.x, y: -smallestAxis.y};
                }

                return {
                    colliding: true,
                    normal: smallestAxis,
                    depth: minOverlap
                }; // collision
            }

            function drawPolygon(poly) {
                ctx.beginPath();
                ctx.moveTo(poly[0].x, poly[0].y);
                for (let i = 1; i < poly.length; i++) {
                    ctx.lineTo(poly[i].x, poly[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = "hsla(" + poly.hue + ", " + poly.health + "%, 50%, 1)";
                ctx.fill();
            };

            function getCenter(vertices) {
                // find the shape's center
                let centerX = 0;
                let centerY = 0;

                for (let i = 0; i < vertices.length; i++) {
                    centerX += vertices[i].x;
                    centerY += vertices[i].y;
                }
                
                centerX = centerX / vertices.length;
                centerY = centerY / vertices.length;

                return {x: centerX, y: centerY};
            }

            function rotatePolygon(vertices, angle) {
                let centerX = getCenter(vertices).x;
                let centerY = getCenter(vertices).y;

                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                for (let i = 0; i < vertices.length; i++) {
                    let point = vertices[i];

                    let dx = point.x - centerX;
                    let dy = point.y - centerY;

                    let rotatedX = dx * cos - dy * sin;
                    let rotatedY = dx * sin + dy * cos;

                    point.x = centerX + rotatedX;
                    point.y = centerY + rotatedY;
                }

                vertices.rot += angle;
            }

            function getContactPoint(shapeA, normal) {
                // Find the vertex on shapeA that penetrates furthest into shapeB along the normal
                let deepestVertex = shapeA[0];
                let maxDist = -Infinity;

                for (let i = 0; i < shapeA.length; i++) {
                    let v = shapeA[i];
                    // Project vertex along normal relative to shape B's center or position
                    let dist = (v.x * normal.x) + (v.y * normal.y);
                    if (dist > maxDist) {
                        maxDist = dist;
                        deepestVertex = v;
                    }
                }
                return deepestVertex;
            }

            let friction = 1;
            let maxSpeed = 2.5;
            let maxRotSpeed = maxSpeed / 20;

            let camera = {
                x: canvas.width,
                y: canvas.height,
                scaleLerp: 0.5,
                init: false
            }

            function draw(deltaTime) {
                if (!deltaTime) { deltaTime = 1; }

                friction = 0.98 - deltaTime / 50;

                if (up) {
                    player.vy += Math.sin(player.rot) * 0.1 * maxSpeed;
                    player.vx += Math.cos(player.rot) * 0.1 * maxSpeed;
                } else if (down) {
                    player.vy += Math.sin(player.rot) * -0.1 * maxSpeed;
                    player.vx += Math.cos(player.rot) * -0.1 * maxSpeed;
                }
                
                player.vy *= friction;
                player.vx *= friction;

                if (left) {
                    player.av -= 0.01 * deltaTime;
                    
                } else if (right) {
                    player.av += 0.01 * deltaTime;
                } 

                player.av *= friction;

                player.av = Math.min(Math.max(player.av, -maxRotSpeed), maxRotSpeed);

                for (let i = 0; i < polygons.length; i++) {
                    let poly = polygons[i];

                    if (i > 0) {
                        poly.vx += Math.cos(poly.rot) * 0.1 * poly.speed;
                        poly.vy += Math.sin(poly.rot) * 0.1 * poly.speed;
                        poly.vx *= friction;
                        poly.vy *= friction;
                        poly.av *= friction;
                    }

                    if (poly.av !== 0) {
                        rotatePolygon(poly, poly.av * deltaTime)
                    }
                }
                

                // update all polygon positions (including player)
                for (let n = 0; n < polygons.length; n++) {
                    for (let i = 0; i < polygons[n].length; i++) {
                        polygons[n][i].y = polygons[n][i].y + polygons[n].vy * deltaTime;
                        polygons[n][i].x = polygons[n][i].x + polygons[n].vx * deltaTime;
                    }
                }
                

                ctx.clearRect(0,0,canvas.width, canvas.height);

                // collision reaction chain
                for (let i = 0; i < polygons.length; i++) {
                    // check every combination minus the duplicates
                    for (let n = i + 1; n < polygons.length; n++) {
                        let polyA = polygons[i];
                        let polyB = polygons[n];
                        
                        let centerA = getCenter(polyA);
                        let centerB = getCenter(polyB);

                        let collision = { colliding: false };
                        // do a preliminary lightweight check to see if the polygons are close enough before implementing SAT collision checks
                        let dx = Math.abs(centerA.x - centerB.x);
                        let dy = Math.abs(centerA.y - centerB.y);
                        let polySizes = polyA.size + polyB.size;
                        if (dx < polySizes + 30 && dy < polySizes + 30) {
                            collision = checkCollision(polyA, polyB);
                        }
                        
                        if (collision.colliding) {
                            
                            let percent = 0.2; // separation percentage
                            let slop = 0.5;
                            let correctionDepth = Math.max(0, collision.depth - slop);

                            let massA = polyA.size * polyA.size;
                            let massB = polyB.size * polyB.size;
                            let invMassA = 1 / massA;
                            let invMassB = 1 / massB;

                            let inertiaA = massA * polyA.size * polyA.size;
                            let inertiaB = massB * polyB.size * polyB.size;
                            let invInertiaA = 1 / (inertiaA * 0.1); 
                            let invInertiaB = 1 / (inertiaB * 0.1);
                            let totalInvMass = invMassA + invMassB;

                            if (correctionDepth > 0 && totalInvMass > 0) {
                                let correctionAdj = correctionDepth / totalInvMass;
                                let correctionX = collision.normal.x * correctionAdj;
                                let correctionY = collision.normal.y * correctionAdj;

                                for (let v of polyA) {
                                    v.x -= correctionX * invMassA;
                                    v.y -= correctionY * invMassA;
                                }
                                for (let v of polyB) {
                                    v.x += correctionX * invMassB;
                                    v.y += correctionY * invMassB;
                                }

                                // add a little bounce to it
                                polyA.vx -= correctionX * 5 * invMassA;
                                polyA.vy -= correctionY * 5 * invMassA;
                                polyB.vx += correctionX * 5 * invMassB;
                                polyB.vy += correctionY * 5 * invMassB;
                            }


                            // find contact points for both shapes relative to the collision normal
                            let contactA = getContactPoint(polyA, collision.normal);
                            let contactB = getContactPoint(polyB, collision.normal);

                            // the contact point is the midpoint between the interacting surface points
                            let contact = {
                                x: (contactA.x + contactB.x) / 2,
                                y: (contactA.y + contactB.y) / 2
                            };

                            let rxA = contact.x - centerA.x;
                            let ryA = contact.y - centerA.y;
                            let rxB = contact.x - centerB.x;
                            let ryB = contact.y - centerB.y;

                            let contactVxA = polyA.vx - polyA.av * ryA;
                            let contactVyA = polyA.vy + polyA.av * rxA;
                            let contactVxB = polyB.vx - polyB.av * ryB;
                            let contactVyB = polyB.vy + polyB.av * rxB;

                            let relVelX = contactVxA - contactVxB;
                            let relVelY = contactVyA - contactVyB;
                            let normalVel = relVelX * collision.normal.x + relVelY * collision.normal.y;

                            if (normalVel > 0) {
                                let restitution = 0.3;
                                if (Math.abs(normalVel) < 0.5) {
                                    restitution = 0;
                                }

                                let rCrossNA = (rxA * collision.normal.y) - (ryA * collision.normal.x);
                                let rCrossNB = (rxB * collision.normal.y) - (ryB * collision.normal.x);

                                let denom = invMassA + invMassB + (rCrossNA * rCrossNA) * invInertiaA + (rCrossNB * rCrossNB) * invInertiaB;

                                let impulseScalar = -(1 + restitution) * normalVel / denom;

                                // apply to poly A
                                polyA.vx += (impulseScalar * collision.normal.x) * invMassA;
                                polyA.vy += (impulseScalar * collision.normal.y) * invMassA;
                                polyA.av += rCrossNA * impulseScalar * invInertiaA;
                            
                                // apply to poly B
                                polyB.vx -= (impulseScalar * collision.normal.x) * invMassB;
                                polyB.vy -= (impulseScalar * collision.normal.y) * invMassB;
                                polyB.av -= rCrossNB * impulseScalar * invInertiaB;
                                

                                if (i == 0 && impulseScalar < -700) {
                                    polyB.health -= 30 - polyB.size / 10;
                                    polyB.attacked = 100;
                                    if (i == 0 && !polyB.dup && polyB.health < 10) {
                                        let duplicate
                                        if (polyB.size < 60) {
                                            duplicate = true;
                                        } else {
                                            duplicate = false;
                                        }
                                        let duplicateNum = rand(2, 6);
                                        let duplicateVert = polyB.vertNum;
                                        let duplicateSize = polyB.size / duplicateNum;
                                        let duplicateHue = polyB.hue;
                                        polygons.splice(n, 1);
                                        for (let d = 0; d < duplicateNum; d++) {
                                            let angle = (d / duplicateNum) * Math.PI * 2;
                                            let radius = duplicateSize * 2;

                                            let duplicatePos = {
                                                x: centerB.x + Math.cos(angle) * radius,
                                                y: centerB.y + Math.sin(angle) * radius
                                            };
                                            
                                            let duplicateVel = {
                                                x: rand(0, 14) - 7,
                                                y: rand(0, 14) - 7
                                            }
                                            player.vx = 0;
                                            player.vy = 0;
                                            player.av = 0;
                                            polygons.push(createPoly(false, duplicateVert, duplicateSize, duplicate, duplicatePos, duplicateHue, duplicateVel));
                                        }
                                    }
                                }  
                            }
                        }
                    }
                }


                // CAMERA

                let playerCenter = getCenter(player);
                let avgCanvas = (canvas.width + canvas.height) / 2;
                let maxDist = 0;
                for (let i = 1; i < polygons.length; i++) {
                    let distance = Math.abs(Math.abs(playerCenter.x) - Math.abs(getCenter(polygons[i]).x)) + Math.abs(Math.abs(playerCenter.y) - Math.abs(getCenter(polygons[i]).y));
                    if (distance < avgCanvas) {
                        if (maxDist < distance) {
                            maxDist = distance;
                        }
                    }
                }

                

                if (!camera.init) {
                    camera.x = playerCenter.x;
                    camera.y = playerCenter.y;
                    camera.init = true;
                }

                camera.x = lerp(camera.x, playerCenter.x, 0.05);
                camera.y = lerp(camera.y, playerCenter.y, 0.05);

                ctx.save();

                ctx.translate(canvas.width / 2, canvas.height / 2);

                let scale = Math.min((avgCanvas / maxDist), 1.7);
                
                // when all shapes are out of frame
                if (maxDist < 1) {
                    scale = 1.7;
                }
                
                camera.scaleLerp = lerp(camera.scaleLerp, scale, 0.005);
                
                ctx.scale(camera.scaleLerp, camera.scaleLerp);
                
                ctx.translate(-camera.x, -camera.y);

                for (let i = 0; i < polygons.length; i++) {
                    drawPolygon(polygons[i]);
                }

                // health bars
                for (let i = 0; i < polygons.length; i++) {
                    if (polygons[i].health < 100) {
                        // use attacked variable to hide health bars when not being attacked
                        if (polygons[i].attacked > 0) {
                            polygons[i].attacked -= 0.2;
                        } else {
                            polygons[i].attacked = 0;
                        }
                        let center = getCenter(polygons[i]);
                        ctx.fillStyle = "hsla(0, 100%, 50%, " + polygons[i].attacked / 100 + ")"; // Set the fill color
                        ctx.fillRect(center.x - polygons[i].health / 2, center.y + polygons[i].size + 10, polygons[i].health, 15);
                    }
                }


                ctx.restore();
            }

            let frameCount = 0;
            let fps = 60;
            let lastTime = performance.now();
            let frameInt = 1000 / fps;
            let deltaTimeMultiplier = 1;
            let deltaTime = 0;
            let globalSpeed = 1;

            function loop(currentTime) {
                                
                deltaTime = currentTime - lastTime;
                deltaTimeMultiplier = (deltaTime / frameInt) * globalSpeed;
                
                fps = 1000 / deltaTime;
                
                lastTime = currentTime;
                
                draw(deltaTimeMultiplier);

                // frameCount++
                // if (deltaTime >= 1000) {
                //     frameCount = 0;
                // }
                ctx.fillStyle = "white";
                ctx.font = "16px monospace";
                ctx.fillText(fps.toFixed(0), 10, 25); 
                
                requestAnimationFrame(loop);
            }
            
            loop();
        })()
    </script>
</body>
</html>
